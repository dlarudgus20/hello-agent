[project]
name = "hello-agent"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "dlarudgus20", email = "dlarudgus20@naver.com" }
]
requires-python = ">=3.14"
dependencies = [
    "authlib>=1.9.1",
    "cryptography>=50.0.2",
    "filelock>=4.2.5",
    "keyring>=25.7.0",
    "openai>=3.41.0",
    "platformdirs>=4.14.0",
    "pyjwt[crypto]>=2.15.1",
    "requests>=2.34.2",
    "rich>=15.0.0",
    "tiktoken>=0.14.0",
]

[project.scripts]
hello-agent = "hello_agent:main"

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]
